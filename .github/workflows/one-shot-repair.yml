name: One-shot playback and IJK repair

on:
  push:
    branches: [working]
    paths:
      - '.github/workflows/one-shot-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch playback proxy and IJK compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          proxy = Path("ios/Paladala/Paladala/LocalHLSProxyServer.swift")
          text = proxy.read_text()

          old_wait = (
              "            Task { @MainActor [weak self] in\n"
              "                while Date() < deadline {\n"
              "                    guard let self else {\n"
              "                        cont.resume(throwing: CancellationError()); return\n"
              "                    }\n"
              "                    if let listener = self.listener, listener.state == .ready {\n"
              "                        cont.resume(); return\n"
              "                    }\n"
              "                    try? await Task.sleep(nanoseconds: UInt64(pollIntervalMs) * 1_000_000)\n"
              "                }\n"
              "                cont.resume(throwing: ProxyServerError.listenerTimeout)\n"
              "            }\n"
          )
          new_wait = (
              "            Task { @MainActor [weak self] in\n"
              "                while true {\n"
              "                    guard let self else {\n"
              "                        cont.resume(throwing: CancellationError()); return\n"
              "                    }\n"
              "                    // Check readiness before the deadline. The MainActor task\n"
              "                    // can be scheduled after the nominal timeout even though\n"
              "                    // NWListener already became ready on its own queue.\n"
              "                    if let listener = self.listener, listener.state == .ready {\n"
              "                        cont.resume(); return\n"
              "                    }\n"
              "                    if Date() >= deadline {\n"
              "                        cont.resume(throwing: ProxyServerError.listenerTimeout); return\n"
              "                    }\n"
              "                    try? await Task.sleep(nanoseconds: UInt64(pollIntervalMs) * 1_000_000)\n"
              "                }\n"
              "            }\n"
          )
          if text.count(old_wait) != 1:
              raise SystemExit(f"LocalHLSProxyServer: wait loop sites={text.count(old_wait)}")
          text = text.replace(old_wait, new_wait, 1)

          old_serve = (
              "        stop()\n\n"
              "        // Lazy rebuild — `stop()` invalidates `prepSession`.\n"
              "        if prepSession == nil {\n"
              "            prepSession = Self.makePrepSession()\n"
              "        }\n"
          )
          new_serve = (
              "        // Reset the previous VOD session without cancelling the process-wide\n"
              "        // loopback listener. Cold-start prewarm may already have published\n"
              "        // this port; cancelling it here lets the old NWListener's delayed\n"
              "        // .cancelled callback race the replacement listener and clear the\n"
              "        // new baseURL while manifest preparation is in flight.\n"
              "        resetPlaybackStateKeepingListener()\n\n"
              "        if prepSession == nil {\n"
              "            prepSession = Self.makePrepSession()\n"
              "        }\n"
          )
          if text.count(old_serve) != 1:
              raise SystemExit(f"LocalHLSProxyServer: serve reset sites={text.count(old_serve)}")
          text = text.replace(old_serve, new_serve, 1)
          text = text.replace(
              "    /// 1. `stop()` clears any in-flight prep / listener.\n",
              "    /// 1. Reset the previous playback state while keeping the listener bound.\n",
              1,
          )

          stop_marker = (
              "    /// Stop the server.  After this call `baseURL` is `nil`\n"
              "    /// and any in-flight connections are cancelled.  Calling\n"
          )
          helper = (
              "    /// Clear per-playback state while retaining the process-wide loopback\n"
              "    /// listener and its stable base URL. `serve(playback:)` uses this when\n"
              "    /// switching VOD sessions; full lifecycle teardown still goes through\n"
              "    /// `stop()`. Keeping the listener avoids an old NWListener cancellation\n"
              "    /// callback clearing the URL published by a newly-created listener.\n"
              "    private func resetPlaybackStateKeepingListener() {\n"
              "        var streamsToCancel: [StreamingProxyTask] = []\n"
              "        lock.lock()\n"
              "        currentPlayback = nil\n"
              "        localContext = nil\n"
              "        currentLivePlayback = nil\n"
              "        currentBvid = nil\n"
              "        currentCid = nil\n"
              "        currentQn = nil\n"
              "        probedSizes.removeAll()\n"
              "        probeInFlight.removeAll()\n"
              "        failedProbes.removeAll()\n"
              "        failoverIndex.removeAll()\n"
              "        trackSegmentIndex.removeAll()\n"
              "        decidedModes.removeAll()\n"
              "        inFlightRanges.removeAll()\n"
              "        streamsToCancel = Array(activeStreams.values)\n"
              "        activeStreams.removeAll()\n"
              "        if baseURL != nil, port != 0 {\n"
              "            state = .listening(port: port)\n"
              "        } else {\n"
              "            state = .idle\n"
              "        }\n"
              "        lock.unlock()\n"
              "        for stream in streamsToCancel {\n"
              "            stream.cancel()\n"
              "        }\n"
              "        diagLog(.playback, \"LocalHLSProxyServer playback state reset\",\n"
              "                details: [\"keptListener\": listener != nil])\n"
              "    }\n\n"
          )
          if "private func resetPlaybackStateKeepingListener()" not in text:
              if text.count(stop_marker) != 1:
                  raise SystemExit(f"LocalHLSProxyServer: stop marker sites={text.count(stop_marker)}")
              text = text.replace(stop_marker, helper + stop_marker, 1)
          proxy.write_text(text)

          injection = (
              "          audiokit = Path(\"ios/IJKMediaPlayer/IJKMediaPlayer/IJKAudioKit.m\")\n"
              "          text = audiokit.read_text()\n"
              "          method_start = text.index(\"- (BOOL)setActive:(BOOL)active\")\n"
              "          method_end_marker = \"\\n}\\n\\n- (void)handleInterruption:\"\n"
              "          method_end = text.index(method_end_marker, method_start)\n"
              "          if \"return YES;\" not in text[method_start:method_end]:\n"
              "              text = text[:method_end] + \"\\n    return YES;\" + text[method_end:]\n"
              "          audiokit.write_text(text)\n\n"
          )
          anchor = (
              "          version.write_text(updated)\n\n"
              "          h264 = Path(\"ios/ffmpeg-arm64/libavcodec/aarch64/h264dsp_init_aarch64.c\")\n"
          )
          for workflow_name in (
              ".github/workflows/ijkplayer-ci.yml",
              ".github/workflows/ios-unsigned-ipa.yml",
          ):
              workflow = Path(workflow_name)
              workflow_text = workflow.read_text()
              if 'audiokit = Path("ios/IJKMediaPlayer/IJKMediaPlayer/IJKAudioKit.m")' in workflow_text:
                  continue
              if workflow_text.count(anchor) != 1:
                  raise SystemExit(f"{workflow}: compatibility anchor sites={workflow_text.count(anchor)}")
              workflow.write_text(
                  workflow_text.replace(
                      anchor,
                      "          version.write_text(updated)\n\n" + injection
                      + "          h264 = Path(\"ios/ffmpeg-arm64/libavcodec/aarch64/h264dsp_init_aarch64.c\")\n",
                      1,
                  )
              )
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'resetPlaybackStateKeepingListener' ios/Paladala/Paladala/LocalHLSProxyServer.swift
          grep -n 'Check readiness before the deadline' ios/Paladala/Paladala/LocalHLSProxyServer.swift
          grep -n 'audiokit = Path' .github/workflows/ijkplayer-ci.yml
          grep -n 'audiokit = Path' .github/workflows/ios-unsigned-ipa.yml
          git diff --check

      - name: Commit repair to working
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Darren"
          git config user.email "168272439+darrenintr@users.noreply.github.com"
          git add ios/Paladala/Paladala/LocalHLSProxyServer.swift \
                  .github/workflows/ijkplayer-ci.yml \
                  .github/workflows/ios-unsigned-ipa.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: stabilize playback proxy and IJKPlayer CI"
          git pull --rebase origin working
          git push origin HEAD:working
