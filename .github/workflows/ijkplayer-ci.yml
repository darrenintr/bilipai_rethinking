name: IJKPlayer Framework CI

on:
  workflow_dispatch:
  push:
    branches: [working]

permissions:
  contents: read

concurrency:
  group: ijkplayer-framework-ci
  cancel-in-progress: false

env:
  IJKPLAYER_REF: master
  FF_ALL_ARCHS: arm64

jobs:
  build-ijkplayer:
    name: Build IJKMediaFramework
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone and initialise IJKPlayer
        shell: bash
        run: |
          set -euo pipefail
          export IJKPLAYER_SRC="$RUNNER_TEMP/ijkplayer-src"
          export IJKPLAYER_BUILD="$RUNNER_TEMP/ijkplayer-build"
          echo "IJKPLAYER_SRC=$IJKPLAYER_SRC" >> "$GITHUB_ENV"
          echo "IJKPLAYER_BUILD=$IJKPLAYER_BUILD" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$IJKPLAYER_REF" \
            https://github.com/Bilibili/ijkplayer.git "$IJKPLAYER_SRC"
          cd "$IJKPLAYER_SRC"
          # Passing arm64 is essential: init-ios.sh's default is the removed
          # 32-bit iOS architectures and creates unnecessary source trees.
          bash init-ios.sh arm64
          test -d ios/ffmpeg-arm64
          test -f ios/IJKMediaPlayer/IJKMediaPlayer/IJKFFMoviePlayerController.m

      - name: Apply compatibility fixes to the pinned FFmpeg fork
        shell: bash
        run: |
          set -euo pipefail
          cd "$IJKPLAYER_SRC"
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = Path("ios/IJKMediaPlayer/IJKMediaPlayer/IJKFFMoviePlayerController.m")
          source = version.read_text()
          updated, count = re.subn(
              r'(static const char \*kIJKFFRequiredFFmpegVersion\s*=\s*)"[^"]*";',
              r'\1"ff4.0--ijk0.8.8--20210426--001";', source, count=1,
          )
          if count != 1:
              raise SystemExit("IJK FFmpeg version declaration not found")
          version.write_text(updated)

          h264 = Path("ios/ffmpeg-arm64/libavcodec/aarch64/h264dsp_init_aarch64.c")
          text = h264.read_text()
          if '#pragma clang diagnostic ignored "-Wincompatible-function-pointer-types"'  not in text:
              text = ("#pragma clang diagnostic push\n"
                      "#pragma clang diagnostic ignored \"-Wincompatible-function-pointer-types\"\n"
                      + text + "\n#pragma clang diagnostic pop\n")
          h264.write_text(text.replace("#include <stdint.h>\n", "#include <stdint.h>\n#include <stddef.h>\n", 1)
                              .replace("int stride, int height", "ptrdiff_t stride, int height"))

          dictionary = Path("ios/ffmpeg-arm64/libavutil/dict.c")
          text = dictionary.read_text()
          # uintptr_t is an integer type on arm64; NULL initializers and
          # NULL returns trigger modern clang diagnostics in these helpers.
          text = text.replace("    uintptr_t ptr = NULL;", "    uintptr_t ptr = 0;")
          text = text.replace("   uintptr_t ptr = NULL;", "   uintptr_t ptr = 0;")
          text = text.replace("    return NULL;\n}\n\nuintptr_t av_dict_strtoptr", "    return 0;\n}\n\nuintptr_t av_dict_strtoptr", 1)
          # Only av_dict_strtoptr returns an integer; leave pointer-returning
          # av_dict_get and other helpers unchanged.
          start = text.index("uintptr_t av_dict_strtoptr")
          end = text.index("char * av_dict_ptrtostr", start)
          text = text[:start] + text[start:end].replace("       return NULL;\n", "       return 0;\n") + text[end:]
          dictionary.write_text(text)

          ijkdict = Path("ijkmedia/ijkplayer/ijkavutil/ijkdict.c")
          text = ijkdict.read_text()
          text = text.replace(
              "if ((t = av_dict_get(m, key, NULL, 0)))",
              "if ((t = ijk_av_dict_get(m, key, NULL, 0)))",
              1,
          )
          ijkdict.write_text(text)

          compile = Path("ios/tools/do-compile-ffmpeg.sh")
          text = compile.read_text()
          text = text.replace("FFMPEG_EXTRA_CFLAGS=\n", "FFMPEG_EXTRA_CFLAGS=${FFMPEG_EXTRA_CFLAGS:-}\n", 1)
          compile.write_text(text)
          PY

      - name: Build FFmpeg
        shell: bash
        env:
          FFMPEG_EXTRA_CFLAGS: -Wno-error
        run: |
          set -euo pipefail
          cd "$IJKPLAYER_SRC/ios"
          # compile-ffmpeg.sh arm64 only touches the supported device slice;
          # using its clean target would iterate missing legacy arch folders.
          rm -rf build/ffmpeg-arm64
          bash compile-ffmpeg.sh arm64 2>&1 | tee "$RUNNER_TEMP/ffmpeg-build.log"
          test -f build/ffmpeg-arm64/output/lib/libavformat.a
          test -f build/ffmpeg-arm64/output/lib/libavcodec.a

      - name: Build IJKMediaFramework
        shell: bash
        run: |
          set -euo pipefail
          cd "$IJKPLAYER_SRC/ios"
          xcodebuild \
            -project IJKMediaPlayer/IJKMediaPlayer.xcodeproj \
            -target IJKMediaFramework \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            SYMROOT="$IJKPLAYER_BUILD/derived/Build/Products" \
            OBJROOT="$IJKPLAYER_BUILD/derived/Build/Intermediates.noindex" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build 2>&1 | tee "$RUNNER_TEMP/ijkmedia-build.log"
          framework="$(find "$IJKPLAYER_BUILD/derived" -name IJKMediaFramework.framework -type d -print -quit)"
          test -n "$framework"
          echo "IJK_FRAMEWORK=$framework" >> "$GITHUB_ENV"
          test -f "$framework/IJKMediaFramework"

      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: IJKMediaFramework-${{ github.sha }}
          path: ${{ env.IJK_FRAMEWORK }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ijkplayer-build-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ffmpeg-build.log
            ${{ runner.temp }}/ijkmedia-build.log
          if-no-files-found: ignore
          retention-days: 14
