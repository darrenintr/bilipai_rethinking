name: IJKPlayer Framework CI

on:
  workflow_dispatch:
  push:
    branches:
      - working

permissions:
  contents: read

concurrency:
  group: ijkplayer-framework-ci
  cancel-in-progress: false

jobs:
  build-ijkplayer:
    name: Build IJKPlayer.framework
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure paths
        run: |
          set -euo pipefail
          echo "IJKPLAYER_SRC=$RUNNER_TEMP/ijkplayer-src" >> "$GITHUB_ENV"
          echo "IJKPLAYER_BUILD=$RUNNER_TEMP/ijkplayer-build" >> "$GITHUB_ENV"
      - name: Configure IJKPlayer source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/Bilibili/ijkplayer.git "$IJKPLAYER_SRC"
          cd "$IJKPLAYER_SRC"
          python3 - <<'PATCH_INIT'
          from pathlib import Path
          p = Path('init-ios.sh')
          s = p.read_text()
          s = s.replace('FF_ALL_ARCHS_IOS8_SDK="armv7 arm64 i386 x86_64"', 'FF_ALL_ARCHS_IOS8_SDK="arm64"')
          s = s.replace('FF_ALL_ARCHS=$FF_ALL_ARCHS_IOS8_SDK', 'FF_ALL_ARCHS=arm64')
          p.write_text(s)
          PATCH_INIT
          bash init-ios.sh
          test -f ffmpeg-arm64/libavcodec/aarch64/h264dsp_init_aarch64.c
      - name: Patch FFmpeg ABI
        run: |
          set -euo pipefail
          cd "$IJKPLAYER_SRC"
          python3 - <<'PATCH_FFMPEG'
          from pathlib import Path
          p = Path('ffmpeg-arm64/libavcodec/aarch64/h264dsp_init_aarch64.c')
          s = p.read_text()
          if '#include <stddef.h>\n' not in s:
              s = s.replace('#include <stdint.h>\n', '#include <stdint.h>\n#include <stddef.h>\n')
          s = s.replace('int stride, int height', 'ptrdiff_t stride, int height')
          p.write_text(s)
          p = Path('ffmpeg-arm64/libavutil/dict.c')
          s = p.read_text().replace('    uintptr_t ptr = NULL;\n', '').replace('   uintptr_t ptr = NULL;\n', '')
          s = s.replace('    return NULL;\n', '    return 0;\n', 1)
          s = s.replace('        return NULL;\n', '        return 0;\n', 2)
          p.write_text(s)
          PATCH_FFMPEG
      - name: Build FFmpeg and IJKMediaFramework
        run: |
          set -euo pipefail
          cd "$IJKPLAYER_SRC/ios"
          python3 - <<'PATCH_CFLAGS'
          from pathlib import Path
          p = Path('tools/do-compile-ffmpeg.sh')
          s = p.read_text().replace('FFMPEG_EXTRA_CFLAGS=', 'FFMPEG_EXTRA_CFLAGS=${FFMPEG_EXTRA_CFLAGS:-}', 1)
          p.write_text(s)
          PATCH_CFLAGS
          FFMPEG_EXTRA_CFLAGS='-Wno-error -Wno-error=incompatible-function-pointer-types' bash compile-ffmpeg.sh arm64
          test -f build/ffmpeg-arm64/output/lib/libavformat.a
          test -f build/ffmpeg-arm64/output/lib/libavcodec.a
          xcodebuild -project IJKMediaPlayer/IJKMediaPlayer.xcodeproj -scheme IJKMediaPlayer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$IJKPLAYER_BUILD/derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          FRAMEWORK="$(find "$IJKPLAYER_BUILD/derived" -name IJKMediaFramework.framework -type d | head -1)"
          test -n "$FRAMEWORK"
          echo "FRAMEWORK=$FRAMEWORK" >> "$GITHUB_ENV"
          file "$FRAMEWORK/IJKMediaFramework"
          nm "$FRAMEWORK/IJKMediaFramework" | grep -E 'avformat_open_input|avcodec_open2' | head -10
      - name: Upload IJKMediaFramework
        uses: actions/upload-artifact@v4
        with:
          name: IJKMediaFramework-${{ github.sha }}
          path: ${{ env.FRAMEWORK }}
          if-no-files-found: error
          retention-days: 14
