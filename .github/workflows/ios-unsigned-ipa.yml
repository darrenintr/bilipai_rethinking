name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - working
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.gemini/**'

# Release tags are derived from the highest existing prerelease. Queue
# every invocation so two close pushes cannot both select the same next
# build number and race while publishing that tag. Never cancel an active
# package: an already-started run should be allowed to finish its release.
concurrency:
  group: ios-unsigned-ipa-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    env:
      PROJECT_DIR: ios/Paladala
      PROJECT_NAME: Paladala
      PRODUCT_NAME: Paladala
      CONFIGURATION: Release
      DERIVED_DATA: build/ios-derived-data
      IPA_DIST_DIR: build/ios-unsigned-ipa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers

      # ------------------------------------------------------------------
      # Auto-increment the iOS build number so the prerelease list
      # always shows the newest at the top. We pull the highest
      # existing release sequence from the GitHub API and add 1,
      # then write that back to Info.plist *in the
      # runner's working copy only* (no commit, no push, so we
      # never race with the user pushing).  The next workflow
      # run re-derives from gh, so the sequence is monotonic
      # across runs and never resets.
      #
      # If the API call fails (offline / permissions), we fall
      # back to the value currently in Info.plist + 1 so a single
      # bad run doesn't break the pipeline.
      # ------------------------------------------------------------------
      - name: Bump build number
        run: |
          set -euo pipefail
          PLIST="$PROJECT_DIR/$PROJECT_NAME/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist not found at $PLIST"
            exit 1
          fi
          CURRENT="$(/usr/bin/plutil -extract CFBundleVersion raw "$PLIST")"
          if [ -z "$CURRENT" ]; then
            echo "::error::CFBundleVersion is empty in $PLIST"
            exit 1
          fi
          BASE_INT="${CURRENT%%.*}"
          if ! [[ "$BASE_INT" =~ ^[0-9]+$ ]]; then
            echo "::error::CFBundleVersion '$CURRENT' is not numeric"
            exit 1
          fi
          # Discover the highest existing prerelease N via
          # the GitHub Releases API.  We hit the API with
          # curl + the GITHUB_TOKEN because the previous
          # `gh release list` approach returned `[]` on
          # the runner even though the same call works
          # locally — `gh` in a `run:` block does not pick
          # up the job's GITHUB_TOKEN automatically, and
          # an unauthenticated call rate-limits / scopes
          # out to an empty list.  The curl path uses the
          # standard `Authorization: Bearer` header so
          # we know exactly what's happening.
          HIGHEST=0
          REPO="${{ github.repository }}"
          # Paginate up to 4 pages × 100 = 400 tags, more
          # than enough for the prerelease list size.
          TAGS_JSON=""
          for page in 1 2 3 4; do
            PAGE_JSON="$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases?per_page=100&page=$page" \
              2>/dev/null || true)"
            if [ -z "$PAGE_JSON" ]; then break; fi
            # If the page is `[]` (no more releases) we can
            # stop early.  `jq` is installed on the macOS
            # image; if not, fall back to a length check.
            if command -v jq >/dev/null 2>&1; then
              if [ "$(echo "$PAGE_JSON" | jq 'length')" = "0" ]; then break; fi
              TAGS_JSON+="$(echo "$PAGE_JSON" | jq -r '.[].tag_name')"$'\n'
            else
              if [ "$PAGE_JSON" = "[]" ]; then break; fi
              # No jq: pull tag_name with sed (good enough).
              TAGS_JSON+="$(echo "$PAGE_JSON" \
                | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"$'\n'
            fi
          done
          # Diagnostic: dump exactly what the API returned
          # so a future failure here is easy to triage.
          echo "GitHub releases API returned:"
          printf '%s' "$TAGS_JSON" | sed '/^$/d' | sed 's/^/  /'
          TAGS="$(printf '%s' "$TAGS_JSON" | sed '/^$/d')"
          for tag in $TAGS; do
            n=""
            # Match the prerelease tag shapes that the workflow
            # has historically emitted.  Each pattern captures
            # the trailing N so the build sequence is monotonic.
            # NOTE: the v0.5.1+ line follows the pattern
            # v0.5.<marketing-patch>.<N>, e.g. v0.5.1.195 — the
            # previous `^v0\.5\.([0-9]+)$` regex matched
            # v0.5.<N> but NOT v0.5.1.<N>, so HIGHEST stayed at
            # 194 forever and every CI run produced CFBundleVersion
            # 195 (the value of `max(CURRENT, 194) + 1`).  Fixed
            # 2026-07-06.
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
              # v0.5.1.N (current line; marketing version + N).
              n="${BASH_REMATCH[1]}"
            elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
              # v0.4.N (legacy; kept for backward compat with
              # already-released 0.4.<N> tags).
              n="${BASH_REMATCH[1]}"
            elif [[ "$tag" =~ ^v0\.5-beta-ios-([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
            elif [[ "$tag" =~ ^v0\.4-beta-ios-([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
            elif [[ "$tag" =~ ^v0\.3-alpha-ios-([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
            fi
            if [ -n "$n" ] && [ "$n" -gt "$HIGHEST" ]; then
              HIGHEST="$n"
            fi
          done
          BASE="$BASE_INT"
          if [ "$HIGHEST" -gt "$BASE" ]; then BASE="$HIGHEST"; fi
          NEW=$((BASE + 1))
          /usr/bin/plutil -replace CFBundleVersion -string "$NEW" "$PLIST"
          echo "Bumped CFBundleVersion: $CURRENT -> $NEW (highest existing prerelease = $HIGHEST)"
          echo "BUNDLE_VERSION=$NEW" >> "$GITHUB_ENV"

          # ------------------------------------------------------------------
          # Bake the per-build fingerprint inputs into Info.plist so the
          # 关于 page can show a unique 辨识号 (special identifier) for
          # this specific CI run.  Keys read by AppVersion.swift:
          #   - BPBuildChannel  : always "ci" for workflow builds
          #   - BPBuildCommit   : short git SHA (first 7 chars)
          #   - BPBuildDate     : ISO-8601 build timestamp (UTC)
          #   - BPBuildEpoch    : Unix seconds — the actual entropy source
          #                       that makes the SHA-1 fingerprint differ
          #                       across every CI run
          # No `BPBuildIdentifierSalt` set here; the salt knob is reserved
          # for the maintainer to add entropy by hand when needed.
          # ------------------------------------------------------------------
          ISO_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          UNIX_EPOCH="$(date +%s)"
          SHORT_SHA="${GITHUB_SHA::7}"
          /usr/bin/plutil -replace BPBuildChannel   -string "ci"          "$PLIST"
          /usr/bin/plutil -replace BPBuildCommit    -string "$SHORT_SHA"  "$PLIST"
          /usr/bin/plutil -replace BPBuildDate      -string "$ISO_DATE"   "$PLIST"
          /usr/bin/plutil -replace BPBuildEpoch     -string "$UNIX_EPOCH" "$PLIST"
          echo "Baked BPBuild keys: channel=ci commit=$SHORT_SHA date=$ISO_DATE epoch=$UNIX_EPOCH"

      # ------------------------------------------------------------------
      # No CocoaPods step: AliyunPlayer has been replaced by AVPlayer
      # (BiliResourceLoaderDelegate.swift synthesises an HLS manifest
      # from Bilibili's DASH response and proxies fMP4 segments
      # byte-for-byte from the CDN with the right Referer).  The build
      # now consumes the bare .xcodeproj — no workspace needed.
      # ------------------------------------------------------------------

      - name: Verify scheme
        run: |
          set -euo pipefail
          PROJECT="$PROJECT_DIR/$PROJECT_NAME.xcodeproj"
          test -d "$PROJECT" || { echo "::error::Missing project: $PROJECT"; exit 1; }
          xcodebuild -list -project "$PROJECT"
          xcodebuild -list -project "$PROJECT" -json \
            | python3 -c "import json,sys; schemes=json.load(sys.stdin)['project']['schemes']; assert '$PROJECT_NAME' in schemes, f'Scheme $PROJECT_NAME not found in {schemes}'; print('Scheme $PROJECT_NAME present')"

      # ------------------------------------------------------------------
      # No Firebase plist step: Firebase (Analytics + Crashlytics) was
      # fully ripped out of the Paladala target in 2026-07-04 — the SPM
      # dependency, Info.plist keys, build phase, run-script, and
      # GoogleService-Info.plist resource are all gone.  The
      # `FIREBASE_PLIST_BASE64` repo secret can be safely deleted from
      # Settings → Secrets.
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # Build FFmpeg as a static library for arm64 iOS.  This is the
      # demuxer backend for the FFmpegPlaybackEngine that replaces
      # AVPlayer in iOS 26 Beta (which traps inside MetalPerformanceShadersGraph
      # during decode).  Produces .a files consumed by the xcodebuild
      # step below via OTHER_LDFLAGS="-lavformat -lavcodec ...".
      #
      # Cached across runs by `actions/cache` keyed on the build script
      # content + FFmpeg version, so subsequent CI runs skip the
      # ~20 minute compile and use the prebuilt archives directly.
      # ------------------------------------------------------------------
      - name: Cache FFmpeg build artifacts
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-build/arm64
          key: ffmpeg-7.1.1-arm64-v1
          restore-keys: |
            ffmpeg-7.1.1-arm64-

      - name: Build FFmpeg (skipped on cache hit)
        run: |
          set -uo pipefail
          # Skip the slow build when `actions/cache` restored the
          # archives; the post-restore smoke check verifies they're
          # actually present.
          if [ -f "${{ runner.temp }}/ffmpeg-build/arm64/lib/libavformat.a" ] \
             && [ -f "${{ runner.temp }}/ffmpeg-build/arm64/lib/libavcodec.a" ]; then
            echo "FFmpeg archives restored from cache — skipping build"
            exit 0
          fi
          export OUTPUT_DIR="${{ runner.temp }}/ffmpeg-build"
          export FFMPEG_VERSION="7.1.1"
          export PLATFORM_MIN_VERSION="18.0"
          bash scripts/build-ffmpeg.sh
        env:
          # actions/cache saves under $RUNNER_TEMP which maps to a
          # fresh path each run; the script's default OUTPUT_DIR
          # resolves to $(pwd)/build/ffmpeg-build, but we want it
          # under $RUNNER_TEMP so the cache key actually matches.
          OUTPUT_DIR: ${{ runner.temp }}/ffmpeg-build

      - name: Smoke-check FFmpeg artifacts
        run: |
          set -euo pipefail
          FFMPEG_DIR="${{ runner.temp }}/ffmpeg-build/arm64"
          for f in lib/libavformat.a lib/libavcodec.a lib/libavutil.a lib/libswresample.a; do
            test -f "${FFMPEG_DIR}/${f}" || { echo "::error::Missing ${f}"; exit 1; }
          done
          # Surface header path / lib path as envvars so the
          # xcodebuild step can pick them up.
          echo "FFMPEG_INCLUDE=${FFMPEG_DIR}/include" >> "$GITHUB_ENV"
          echo "FFMPEG_LIB=${FFMPEG_DIR}/lib" >> "$GITHUB_ENV"
          echo "FFmpeg archives present at ${FFMPEG_DIR}/lib"

      - name: Build device app without signing
        run: |
          set -uo pipefail
          LOGFILE="$RUNNER_TEMP/build_log.txt"
          xcodebuild \
            -project "$PROJECT_DIR/$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            HEADER_SEARCH_PATHS="${FFMPEG_INCLUDE} \$(inherited)" \
            LIBRARY_SEARCH_PATHS="${FFMPEG_LIB} \$(inherited)" \
            OTHER_LDFLAGS="-lavformat -lavcodec -lavutil -lswresample -liconv -lz \$(inherited)" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$LOGFILE" 2>&1
          XC_EXIT=$?
          echo "xcodebuild exited with code $XC_EXIT"
          echo "LOGFILE=$LOGFILE"
          ls -la "$LOGFILE" || echo "LOGFILE NOT FOUND"
          if [ "$XC_EXIT" -ne 0 ]; then
            # Pull just the Swift error lines into a short summary
            # and post it to the run summary (visible in the
            # Actions UI even when the annotation is truncated).
            {
              echo "## xcodebuild build failed (exit $XC_EXIT)"
              echo ""
              echo "### Swift error lines"
              echo '```'
              grep -E "error:" "$LOGFILE" | head -20 || echo "(no error: lines found)"
              echo '```'
              echo ""
              echo "### Last 40 lines of build log"
              echo '```'
              tail -n 40 "$LOGFILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Also dump to the step log so the inline view
            # has the context.
            echo ""
            echo "=== Swift error lines ==="
            grep -E "error:" "$LOGFILE" | head -20 || echo "(no error: lines)"
            echo "=== Last 40 lines of build log ==="
            tail -n 40 "$LOGFILE"
            exit 1
          fi

      - name: Upload xcodebuild build log
        run: |
          if [ -f "$RUNNER_TEMP/build_log.txt" ]; then
            cp "$RUNNER_TEMP/build_log.txt" "$GITHUB_WORKSPACE/build_log.txt"
            echo "Copied log to workspace"
          else
            echo "No build log to copy (build succeeded)"
            exit 1
          fi
        if: failure()

      - name: Upload xcodebuild build log (artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-build-log-${{ github.run_number }}
          path: ${{ github.workspace }}/build_log.txt
          retention-days: 7
          if-no-files-found: error

      # ------------------------------------------------------------------
      # Mirror the build log to a public orphan branch so an unauth'd
      # agent (or anyone) can read it without a GitHub login.  The
      # web UI requires login to view step logs and download
      # artifacts, but git refs on a public repo are anonymous-
      # fetchable.  We:
      #   1. ensure the orphan branch `ci-logs` exists (create it
      #      on first run, switch into it on every run)
      #   2. write the build log to `logs/ci-{run}-{shortSha}.log`
      #   3. commit + push back to origin/ci-logs
      # This step runs `if: failure()` and `continue-on-error: true`
      # so a git hiccup never poisons the run summary.
      # ------------------------------------------------------------------
      - name: Mirror build log to ci-logs branch
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          # Fetch + create-or-switch the ci-logs branch as an
          # orphan (no shared history with `working`, so it
          # can't pollute the main line).
          # The build-number step intentionally edits Info.plist in
          # the runner's working copy. Reset tracked files before
          # switching branches so that generated version changes do
          # not block checkout after a failed xcodebuild.
          git reset --hard HEAD
          git fetch origin ci-logs 2>/dev/null || true
          if git rev-parse --verify origin/ci-logs >/dev/null 2>&1; then
            git checkout -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf . 2>/dev/null || true
          fi
          mkdir -p logs
          SLUG="ci-${GITHUB_RUN_NUMBER}-$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          cp "$GITHUB_WORKSPACE/build_log.txt" "logs/${SLUG}.log"
          git add "logs/${SLUG}.log"
          git commit -m "ci: xcodebuild log for run #${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA:0:7})" || echo "nothing to commit"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
          echo "Mirrored log to ci-logs branch: logs/${SLUG}.log"

      # ------------------------------------------------------------------
      # Derive a release tag from the build number we just bumped.
      # The patch component is the monotonically increasing build
      # sequence: v0.5.3, v0.5.4, and so on.  The version line
      # (0.4 → 0.5) follows `CFBundleShortVersionString` in
      # Info.plist; bump both at once when shipping a new minor.
      # ------------------------------------------------------------------
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          # BUNDLE_VERSION was set by the `Bump build number` step.
          if [ -z "${BUNDLE_VERSION:-}" ]; then
            echo "::error::BUNDLE_VERSION is not set — did Bump build number run?"
            exit 1
          fi
          # PLIST was defined inside the `Bump build number` step's
          # `run:` block; each `run:` is a fresh shell so the
          # variable does not carry over.  Recompute it here.
          PLIST="$PROJECT_DIR/$PROJECT_NAME/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist not found at $PLIST"
            exit 1
          fi
          # Pull the marketing version (e.g. "0.5.1") from
          # CFBundleShortVersionString so the tag always matches
          # the Info.plist the user ships.  We use a permissive
          # pattern (digits + dots) so a "0.5.1 BETA" suffix
          # can't accidentally land in the tag — the CI gets the
          # numeric version only.
          MARKET_VERSION="$(/usr/bin/plutil -extract CFBundleShortVersionString raw "$PLIST" | grep -Eo '[0-9]+(\.[0-9]+)+' | head -n1)"
          if [ -z "$MARKET_VERSION" ]; then
            echo "::error::Could not parse CFBundleShortVersionString from $PLIST"
            exit 1
          fi
          TAG="v${MARKET_VERSION}.${BUNDLE_VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "MARKET_VERSION=$MARKET_VERSION" >> "$GITHUB_ENV"
          echo "Resolved tag: $TAG (CFBundleVersion=$BUNDLE_VERSION, CFBundleShortVersionString=$MARKET_VERSION)"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos"
          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "::error::Products directory $PRODUCTS_DIR does not exist."
            echo "::group::DerivedData products tree"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -print 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -name "${PRODUCT_NAME}.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::$PRODUCT_NAME.app was not found in $PRODUCTS_DIR."
            echo "::group::Contents of $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            echo "::endgroup::"
            exit 1
          fi

          rm -rf "$IPA_DIST_DIR"
          mkdir -p "$IPA_DIST_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIST_DIR/Payload/"

          (
            cd "$IPA_DIST_DIR"
            /usr/bin/zip -qry "${PRODUCT_NAME}-unsigned-${TAG}.ipa" Payload
            shasum -a 256 "${PRODUCT_NAME}-unsigned-${TAG}.ipa" > checksums.txt
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }}-unsigned-ipa-${{ env.TAG }}
          path: |
            ${{ env.IPA_DIST_DIR }}/${{ env.PRODUCT_NAME }}-unsigned-${{ env.TAG }}.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
          retention-days: 7
          if-no-files-found: error

      - name: Prepare prerelease notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        run: |
          set -euo pipefail
          {
            echo "## Based on commit"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo
            echo "### Commit description"
            echo
            git show --no-patch --format=%B "$GITHUB_SHA"
            echo
            echo "### Build"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- CFBundleShortVersionString: \`${MARKET_VERSION}\`"
            echo "- CFBundleVersion: \`${BUNDLE_VERSION}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Paladala iOS ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.IPA_DIST_DIR }}/${{ env.PRODUCT_NAME }}-unsigned-${{ env.TAG }}.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt

      # ------------------------------------------------------------------
      # AltSource publish — turn the freshly-tagged prerelease into a
      # working AltStore / SideStore source.
      #
      # We push `apps.json` (the AltSource manifest) and `icon.png`
      # (a 256×256 PNG render of PaladalaMark.svg with a brand-pink
      # background — iOS UIImage can't load SVG, so a raw icon.svg
      # would make SideStore refuse the source at add-time) to
      # the orphan `gh-pages` branch, which GitHub Pages serves at
      # https://darrenintr.github.io/pure-bilibili-rethinking/apps.json
      # once the repo's Pages setting is pointed at the branch (one-time
      # manual step in Settings → Pages).
      #
      # Both steps are guarded by the same `push to working` condition
      # as `Create prerelease` so manual `workflow_dispatch` runs that
      # only build the IPA never accidentally publish a half-cooked
      # source entry.
      #
      # We do all of this in `$RUNNER_TEMP` subdirectories so the
      # earlier "Mirror build log to ci-logs branch" step (which runs
      # `git reset --hard HEAD` on the workspace) can't clobber
      # anything we've written, and so a corrupted workspace never
      # leaks into the published source.
      # ------------------------------------------------------------------
      - name: Install librsvg
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        # rsvg-convert is the SVG→PNG renderer used by the next step.
        # The macos-15 runner image ships Homebrew but not librsvg;
        # install it (cached by Homebrew, ~30 s on a cold cache).
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            brew install librsvg
          fi
          rsvg-convert --version

      - name: Generate AltSource assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        env:
          TAG: ${{ env.TAG }}
          BUNDLE_VERSION: ${{ env.BUNDLE_VERSION }}
          MARKET_VERSION: ${{ env.MARKET_VERSION }}
          PRODUCT_NAME: ${{ env.PRODUCT_NAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          echo "Staging AltSource build in $STAGE"

          # 1. Resolve the just-built IPA — `Package unsigned IPA` wrote
          #    it under $IPA_DIST_DIR with the tag baked into the name.
          IPA_FILE="$GITHUB_WORKSPACE/${{ env.IPA_DIST_DIR }}/${{ env.PRODUCT_NAME }}-unsigned-${TAG}.ipa"
          if [ ! -f "$IPA_FILE" ]; then
            echo "::error::Expected IPA not found at $IPA_FILE"
            exit 1
          fi
          # macOS uses -f%z, GNU stat uses -c%s; the runner is macos-15
          # but we keep the fallback so this also runs on a Linux
          # debug job if anyone ever copies the step across.
          IPA_SIZE="$(stat -f%z "$IPA_FILE" 2>/dev/null \
                      || stat -c%s "$IPA_FILE")"
          echo "IPA: $IPA_FILE  ($IPA_SIZE bytes)"

          # 2. Pull the previous apps.json from gh-pages. On the first
          #    run this 404s, which is fine — the script treats an empty
          #    file as "no history" and emits a complete schema.
          if curl -fsSL --retry 3 --retry-delay 1 \
              -o "$STAGE/apps.json" \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/apps.json"; then
            echo "Fetched existing apps.json from gh-pages"
          else
            echo "No existing apps.json on gh-pages — first publish, bootstrapping from empty"
            : > "$STAGE/apps.json"
          fi

          # 3. Render the brand mark as a 256×256 PNG with a brand-pink
          #    background. We need PNG, not SVG, because iOS UIImage
          #    (which both AltStore and SideStore use to load source
          #    icons) doesn't understand SVG — and SideStore in
          #    particular rejects the source outright if it can't load
          #    the icon at add-time. The background rect is injected
          #    into a copy of the SVG so the white stroke stays visible
          #    on AltStore's white UI; the repo's original SVG is left
          #    untouched (it's still used by the landing page and the
          #    iOS app icon directly).
          python3 - <<'PY'
          from pathlib import Path
          svg = Path("$GITHUB_WORKSPACE/ios/Paladala/Paladala/Brand/PaladalaMark.svg").read_text()
          with_bg = svg.replace(
              'stroke-linejoin="round">',
              'stroke-linejoin="round"><rect width="140" height="140" fill="#FB7299"/>',
              1,
          )
          Path("$STAGE/icon-bg.svg").write_text(with_bg)
          PY
          rsvg-convert -w 256 -h 256 "$STAGE/icon-bg.svg" -o "$STAGE/icon.png"
          echo "Generated icon.png from PaladalaMark.svg with brand-pink background"

          # 4. Generate the merged manifest. The script de-duplicates by
          #    buildVersion / tag, so re-running this job for the same
          #    BUNDLE_VERSION updates the entry in place instead of
          #    appending a duplicate.
          python3 scripts/generate_apps_json.py \
            --existing     "$STAGE/apps.json" \
            --release-notes "$RUNNER_TEMP/release-notes.md" \
            --ipa-path     "$IPA_FILE" \
            --output       "$STAGE/apps.json.new"

          # 5. Validate the output before we ever push it. The workflow
          #    stops here if the script somehow produced malformed JSON
          #    or stripped a required key — better to fail the job than
          #    publish a broken source.
          STAGE_DIR="$STAGE" python3 -c '
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["STAGE_DIR"], "apps.json.new")))
          required = ["name", "bundleIdentifier", "developerName", "version",
                      "buildVersion", "versions", "news", "iconURL", "tintColor"]
          missing = [k for k in required if k not in d]
          if missing:
              sys.stderr.write("::error::apps.json missing keys: " + ", ".join(missing) + "\n")
              sys.exit(1)
          if not d["versions"]:
              sys.stderr.write("::error::apps.json has empty versions[]\n")
              sys.exit(1)
          top = d["versions"][0]
          assert top["buildVersion"] == d["buildVersion"], "top buildVersion != versions[0].buildVersion"
          assert top["version"] == d["version"], "top version != versions[0].version"
          print("apps.json validated: top version=" + d["version"]
                + " buildVersion=" + d["buildVersion"]
                + " history=" + str(len(d["versions"])) + " entries")
          '

          mv "$STAGE/apps.json.new" "$STAGE/apps.json"
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"

      - name: Publish to gh-pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fresh clone in $RUNNER_TEMP so the workspace (which the
          # earlier "Mirror build log" step can `git reset --hard HEAD`)
          # stays intact, and so the IPA / build log artefacts in
          # $GITHUB_WORKSPACE aren't accidentally included in the
          # gh-pages commit.
          PUB="$(mktemp -d)"
          cd "$PUB"
          git init -q -b gh-pages
          git config user.name  "ci-altstore-bot"
          git config user.email "ci-altstore-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # If gh-pages already exists, sync it in; otherwise create an
          # empty initial commit so `git push` can spin up the branch.
          if git fetch --depth 1 origin gh-pages 2>/dev/null; then
            git reset --hard origin/gh-pages
            echo "Reset to existing origin/gh-pages"
          else
            echo "Branch gh-pages does not exist yet — bootstrapping"
            git commit --allow-empty -q -m "chore: bootstrap gh-pages branch"
          fi

          # Copy (not rm -rf + cp) so any extra files a human has
          # placed on gh-pages — extra screenshots, a custom
          # index.html, etc. — survive this run.
          cp "$STAGE_DIR/apps.json" apps.json
          cp "$STAGE_DIR/icon.png"  icon.png

          # Only commit if something actually changed. Re-running the
          # workflow for a buildVersion that's already in apps.json
          # will end up with a no-op diff (just _meta + a new date),
          # so the canonical "is anything staged" check saves a
          # pointless empty commit on the gh-pages branch.
          git add apps.json icon.png
          if git diff --cached --quiet; then
            echo "No changes to publish (apps.json already up to date)"
          else
            git commit -q -m "ci: update AltSource to ${TAG}"
            git push -q origin gh-pages
            REPO_OWNER="${GITHUB_REPOSITORY%%/*}"
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            echo "Published AltSource to https://${REPO_OWNER}.github.io/${REPO_NAME}/apps.json"
          fi
