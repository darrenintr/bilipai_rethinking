name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - working
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.gemini/**'

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    env:
      PROJECT_DIR: ios/BiliPaiNative
      PROJECT_NAME: BiliPaiNative
      CONFIGURATION: Release
      DERIVED_DATA: build/ios-derived-data
      IPA_DIST_DIR: build/ios-unsigned-ipa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          pod install

      # ------------------------------------------------------------------
      # Drop the [CP] Embed Pods Frameworks build phase from the
      # BiliPaiNative target.  CocoaPods adds this phase to run
      # `Pods-BiliPaiNative-frameworks.sh`, which in turn invokes rsync
      # to copy vendored frameworks into <App>.app/Frameworks.  On Xcode
      # 15+ the build sandbox denies that file-write, so the rsync step
      # aborts the build with "Sandbox: rsync(...) deny(1)".
      #
      # The next workflow step ("Manually embed AliPlayerSDK frameworks")
      # copies the same frameworks with `cp -R` outside the sandbox, so
      # the embed phase is redundant; we just need it gone before
      # xcodebuild reads the project.  Doing this in the workflow (post
      # `pod install`) is more reliable than mutating the project from
      # the Podfile's post_install hook, because the on-disk project is
      # fully written and stable at this point.
      # ------------------------------------------------------------------
      - name: Drop [CP] Embed Pods Frameworks phase
        run: |
          set -euo pipefail
          ruby -e '
            require "xcodeproj"
            project_path = File.join(ENV["PROJECT_DIR"], ENV["PROJECT_NAME"] + ".xcodeproj")
            abort "Project not found: #{project_path}" unless File.directory?(project_path)

            project = Xcodeproj::Project.open(project_path)
            removed = 0
            project.targets.each do |t|
              next unless t.name == ENV["PROJECT_NAME"]
              t.build_phases.dup.each do |bp|
                name_hit   = bp.respond_to?(:name) && bp.name.to_s.include?("Embed Pods Frameworks")
                script_hit = bp.respond_to?(:shell_script) && bp.shell_script.to_s.include?("-frameworks.sh")
                next unless name_hit || script_hit
                t.build_phases.delete(bp)
                removed += 1
              end
            end
            abort "No embed-frameworks phase found in #{ENV["PROJECT_NAME"]} target" if removed.zero?
            project.save
            puts "[embed-phase patch] Removed #{removed} phase(s) from #{ENV["PROJECT_NAME"]}"
          '

      - name: Verify workspace and scheme
        run: |
          set -euo pipefail
          WORKSPACE="$PROJECT_DIR/$PROJECT_NAME.xcworkspace"
          test -d "$WORKSPACE" || { echo "::error::Missing workspace: $WORKSPACE"; exit 1; }
          xcodebuild -list -workspace "$WORKSPACE"
          xcodebuild -list -workspace "$WORKSPACE" -json \
            | python3 -c "import json,sys; schemes=json.load(sys.stdin)['workspace']['schemes']; assert '$PROJECT_NAME' in schemes, f'Scheme $PROJECT_NAME not found in {schemes}'; print('Scheme $PROJECT_NAME present')"

      - name: Build device app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$PROJECT_DIR/$PROJECT_NAME.xcworkspace" \
            -scheme "$PROJECT_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Manually embed AliPlayerSDK frameworks
        run: |
          set -euo pipefail
          PRODUCTS="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos"
          FRAMEWORKS="$PRODUCTS/$PROJECT_NAME.app/Frameworks"
          mkdir -p "$FRAMEWORKS"
          cp -R "$PROJECT_DIR/Pods/AliPlayerSDK_iOS/AliyunPlayer.framework" "$FRAMEWORKS/"
          cp -R "$PROJECT_DIR/Pods/AliPlayerSDK_iOS/alivcffmpeg.framework" "$FRAMEWORKS/"
          cp -R "$PROJECT_DIR/Pods/AliPlayerSDK_iOS/AliyunMediaDownloader.framework" "$FRAMEWORKS/"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos"
          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "::error::Products directory $PRODUCTS_DIR does not exist."
            echo "::group::DerivedData products tree"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -print 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -name "${PROJECT_NAME}.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::$PROJECT_NAME.app was not found in $PRODUCTS_DIR."
            echo "::group::Contents of $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            echo "::endgroup::"
            exit 1
          fi

          rm -rf "$IPA_DIST_DIR"
          mkdir -p "$IPA_DIST_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIST_DIR/Payload/"

          (
            cd "$IPA_DIST_DIR"
            /usr/bin/zip -qry "${PROJECT_NAME}-unsigned.ipa" Payload
            shasum -a 256 "${PROJECT_NAME}-unsigned.ipa" > checksums.txt
          )

      - name: Verify AliPlayerSDK is embedded in the IPA
        run: |
          set -euo pipefail
          IPA_PATH="$IPA_DIST_DIR/${PROJECT_NAME}-unsigned.ipa"
          # AliPlayerSDK embeds as AliyunPlayer.framework inside the app bundle
          if ! /usr/bin/unzip -l "$IPA_PATH" | /usr/bin/grep -q 'AliyunPlayer.framework'; then
            echo "::error::AliyunPlayer.framework was not embedded in the IPA."
            echo "::group::IPA contents"
            /usr/bin/unzip -l "$IPA_PATH" | head -50
            echo "::endgroup::"
            exit 1
          fi
          echo "AliyunPlayer.framework is embedded."

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-unsigned-ipa
          path: |
            ${{ env.IPA_DIST_DIR }}/${{ env.PROJECT_NAME }}-unsigned.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
          retention-days: 7
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
