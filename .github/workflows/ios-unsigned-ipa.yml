name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - working
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.gemini/**'

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    # `macos-15` ships Xcode 16.x as the default toolchain, which matches the
    # minimum-deployment target of iOS 18.0 in BiliPaiNative.xcodeproj. Pin
    # explicitly so a future runner upgrade does not silently swap in a
    # toolchain that drops iOS 18 support.
    runs-on: macos-15
    env:
      PROJECT_PATH: ios/BiliPaiNative/BiliPaiNative.xcodeproj
      SCHEME: BiliPaiNative
      CONFIGURATION: Release
      DERIVED_DATA: build/ios-derived-data
      IPA_DIST_DIR: build/ios-unsigned-ipa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers

      - name: Fetch MobileVLCKit xcframework
        # The local SPM package at ios/BiliPaiNative/LocalPackages/MobileVLCKit
        # wraps a binary target whose .xcframework is not committed to the
        # repo. Pull it from the pinned VLC CDN URL set in the script's
        # `VLC_XCFRAMEWORK_URL` default; the script also handles a
        # SHA-256 integrity check when `VLC_XCFRAMEWORK_SHA256` is
        # provided. The previous attempt (commit 1a95b9f6) used a
        # remote `videolan/vlc-ios` SwiftPM reference and failed with
        # "Missing package product MobileVLCKit" — that repo does not
        # publish MobileVLCKit as an SPM product, only CocoaPods.
        # MUST run before any `xcodebuild` call — `xcodebuild -list`
        # triggers package-graph resolution, and a missing binary target
        # there fails with "does not contain a binary artifact".
        run: |
          set -euo pipefail
          bash scripts/fetch_mobilelockit.sh

      - name: Verify project + scheme exist
        # Fail fast with a clear message if the iOS-native project layout
        # has drifted (renamed scheme, moved .xcodeproj, etc.) before
        # kicking off the long build. `.xcodeproj` is a directory bundle,
        # not a file, so we use `-d` (or `-e`) rather than `-f`.
        run: |
          set -euo pipefail
          test -d "$PROJECT_PATH" || { echo "::error::Missing $PROJECT_PATH"; exit 1; }
          xcodebuild -list -project "$PROJECT_PATH"
          # `xcodebuild -list -json` emits `schemes` as a list of plain
          # strings (not dicts), so we just do an `in` check.
          xcodebuild -list -project "$PROJECT_PATH" -json \
            | python3 -c "import json,sys; schemes=json.load(sys.stdin)['project']['schemes']; assert '$SCHEME' in schemes, f'Scheme $SCHEME not found in {schemes}'; print('Scheme $SCHEME present')"

      - name: Resolve Swift Package Dependencies
        # Force a clean SPM resolution against the local MobileVLCKit
        # package so any layout / Package.swift error surfaces with a
        # clear message *before* the long build step. Mirrors what an
        # interactive Xcode "Resolve Package Versions" does.
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -resolvePackageDependencies

      - name: Build device app without signing
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos"
          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "::error::Products directory $PRODUCTS_DIR does not exist."
            echo "::group::DerivedData products tree"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -print 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

          # NOTE: the `-name` pattern MUST be in double quotes so the
          # shell expands `$SCHEME` — single quotes would pass the
          # literal `${SCHEME}.app` to find and match nothing.
          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -name "${SCHEME}.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::$SCHEME.app was not found in $PRODUCTS_DIR."
            echo "::group::Contents of $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            echo "::endgroup::"
            exit 1
          fi

          rm -rf "$IPA_DIST_DIR"
          mkdir -p "$IPA_DIST_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIST_DIR/Payload/"

          (
            cd "$IPA_DIST_DIR"
            /usr/bin/zip -qry "${SCHEME}-unsigned.ipa" Payload
            shasum -a 256 "${SCHEME}-unsigned.ipa" > checksums.txt
          )

      - name: Verify MobileVLCKit is embedded in the IPA
        # Smoke-test the IPA: the framework must be inside the bundle's
        # Frameworks directory or `VLCPlayerView` will load a placeholder
        # at runtime. If this fails the user sees "VLCKit not linked"
        # and live playback is silently disabled — fail the workflow
        # loudly instead.
        run: |
          set -euo pipefail
          IPA_PATH="$IPA_DIST_DIR/${SCHEME}-unsigned.ipa"
          if ! /usr/bin/unzip -l "$IPA_PATH" | /usr/bin/grep -q 'Payload/.*\.app/Frameworks/MobileVLCKit.framework/MobileVLCKit'; then
            echo "::error::MobileVLCKit.framework was not embedded in the IPA."
            echo "::group::IPA contents"
            /usr/bin/unzip -l "$IPA_PATH" | head -50
            echo "::endgroup::"
            exit 1
          fi
          echo "MobileVLCKit.framework is embedded."

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}-unsigned-ipa
          path: |
            ${{ env.IPA_DIST_DIR }}/${{ env.SCHEME }}-unsigned.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
          retention-days: 7
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v0.3-alpha-ios-${{ github.run_number }}"
          name: "iOS 0.3 ALPHA (Build ${{ github.run_number }})"
          body: |
            BiliPai Native iOS 0.3 ALPHA build generated by GitHub Actions.

            **Version:** 0.3 ALPHA
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}
            **Build Number:** ${{ github.run_number }}

            This is an unsigned IPA. You can install it using TrollStore or by self-signing it with tools like AltStore or Sideloadly.
          prerelease: true
          files: |
            ${{ env.IPA_DIST_DIR }}/${{ env.SCHEME }}-unsigned.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
