name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - working
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.gemini/**'

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    env:
      PROJECT_DIR: ios/Paladala
      PROJECT_NAME: Paladala
      PRODUCT_NAME: Paladala
      CONFIGURATION: Release
      DERIVED_DATA: build/ios-derived-data
      IPA_DIST_DIR: build/ios-unsigned-ipa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers

      # ------------------------------------------------------------------
      # Auto-increment the iOS build number so the prerelease list
      # always shows the newest at the top. We pull the highest
      # existing release sequence from the GitHub API and add 1,
      # then write that back to Info.plist *in the
      # runner's working copy only* (no commit, no push, so we
      # never race with the user pushing).  The next workflow
      # run re-derives from gh, so the sequence is monotonic
      # across runs and never resets.
      #
      # If the API call fails (offline / permissions), we fall
      # back to the value currently in Info.plist + 1 so a single
      # bad run doesn't break the pipeline.
      # ------------------------------------------------------------------
      - name: Bump build number
        run: |
          set -euo pipefail
          PLIST="$PROJECT_DIR/$PROJECT_NAME/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist not found at $PLIST"
            exit 1
          fi
          CURRENT="$(/usr/bin/plutil -extract CFBundleVersion raw "$PLIST")"
          if [ -z "$CURRENT" ]; then
            echo "::error::CFBundleVersion is empty in $PLIST"
            exit 1
          fi
          BASE_INT="${CURRENT%%.*}"
          if ! [[ "$BASE_INT" =~ ^[0-9]+$ ]]; then
            echo "::error::CFBundleVersion '$CURRENT' is not numeric"
            exit 1
          fi
          # Discover the highest existing prerelease N via
          # the GitHub Releases API.  We hit the API with
          # curl + the GITHUB_TOKEN because the previous
          # `gh release list` approach returned `[]` on
          # the runner even though the same call works
          # locally — `gh` in a `run:` block does not pick
          # up the job's GITHUB_TOKEN automatically, and
          # an unauthenticated call rate-limits / scopes
          # out to an empty list.  The curl path uses the
          # standard `Authorization: Bearer` header so
          # we know exactly what's happening.
          HIGHEST=0
          REPO="${{ github.repository }}"
          # Paginate up to 4 pages × 100 = 400 tags, more
          # than enough for the prerelease list size.
          TAGS_JSON=""
          for page in 1 2 3 4; do
            PAGE_JSON="$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases?per_page=100&page=$page" \
              2>/dev/null || true)"
            if [ -z "$PAGE_JSON" ]; then break; fi
            # If the page is `[]` (no more releases) we can
            # stop early.  `jq` is installed on the macOS
            # image; if not, fall back to a length check.
            if command -v jq >/dev/null 2>&1; then
              if [ "$(echo "$PAGE_JSON" | jq 'length')" = "0" ]; then break; fi
              TAGS_JSON+="$(echo "$PAGE_JSON" | jq -r '.[].tag_name')"$'\n'
            else
              if [ "$PAGE_JSON" = "[]" ]; then break; fi
              # No jq: pull tag_name with sed (good enough).
              TAGS_JSON+="$(echo "$PAGE_JSON" \
                | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"$'\n'
            fi
          done
          # Diagnostic: dump exactly what the API returned
          # so a future failure here is easy to triage.
          echo "GitHub releases API returned:"
          printf '%s' "$TAGS_JSON" | sed '/^$/d' | sed 's/^/  /'
          TAGS="$(printf '%s' "$TAGS_JSON" | sed '/^$/d')"
          for tag in $TAGS; do
            n=""
            if [[ "$tag" =~ ^v0\.4\.([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
            elif [[ "$tag" =~ ^v0\.4-beta-ios-([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
            elif [[ "$tag" =~ ^v0\.3-alpha-ios-([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
            fi
            if [ -n "$n" ] && [ "$n" -gt "$HIGHEST" ]; then
              HIGHEST="$n"
            fi
          done
          BASE="$BASE_INT"
          if [ "$HIGHEST" -gt "$BASE" ]; then BASE="$HIGHEST"; fi
          NEW=$((BASE + 1))
          /usr/bin/plutil -replace CFBundleVersion -string "$NEW" "$PLIST"
          echo "Bumped CFBundleVersion: $CURRENT -> $NEW (highest existing prerelease = $HIGHEST)"
          echo "BUNDLE_VERSION=$NEW" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # No CocoaPods step: AliyunPlayer has been replaced by AVPlayer
      # (BiliResourceLoaderDelegate.swift synthesises an HLS manifest
      # from Bilibili's DASH response and proxies fMP4 segments
      # byte-for-byte from the CDN with the right Referer).  The build
      # now consumes the bare .xcodeproj — no workspace needed.
      # ------------------------------------------------------------------

      - name: Verify scheme
        run: |
          set -euo pipefail
          PROJECT="$PROJECT_DIR/$PROJECT_NAME.xcodeproj"
          test -d "$PROJECT" || { echo "::error::Missing project: $PROJECT"; exit 1; }
          xcodebuild -list -project "$PROJECT"
          xcodebuild -list -project "$PROJECT" -json \
            | python3 -c "import json,sys; schemes=json.load(sys.stdin)['project']['schemes']; assert '$PROJECT_NAME' in schemes, f'Scheme $PROJECT_NAME not found in {schemes}'; print('Scheme $PROJECT_NAME present')"

      # ------------------------------------------------------------------
      # The Paladala target ships GoogleService-Info.plist in Copy
      # Bundle Resources (Firebase init at runtime, Crashlytics symbol
      # upload at build time). The plist itself is gitignored so the
      # API_KEY never enters git history. CI decodes the file from the
      # FIREBASE_PLIST_BASE64 repo secret (set via the GitHub Actions
      # settings page) at build time — see the project README for the
      # rotation procedure.
      #
      # Local developers keep the real plist in
      # ios/Paladala/Paladala/GoogleService-Info.plist; the [ -f $PLIST ]
      # guard below keeps this step a no-op for them.
      # ------------------------------------------------------------------
      - name: Decode Firebase plist from secret
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          PLIST="$PROJECT_DIR/$PROJECT_NAME/GoogleService-Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Found existing GoogleService-Info.plist at $PLIST; using it as-is."
            exit 0
          fi
          echo "::notice::FIREBASE_PLIST_BASE64 length: ${#FIREBASE_PLIST_BASE64} bytes"
          if [ -z "${FIREBASE_PLIST_BASE64:-}" ]; then
            echo "::error::FIREBASE_PLIST_BASE64 secret value is empty after env injection."
            echo "::error::The secret exists in repo Settings -> Secrets and variables -> Actions,"
            echo "::error::but the workflow runner received an empty string. Common causes:"
            echo "::error::* the value field was saved blank (paste never landed)"
            echo "::error::* a stray newline split the value into two halves and GitHub only kept the empty half"
            echo "::error::* the value was saved as plain text instead of base64"
            echo "::error::Re-open Settings -> Secrets and variables -> Actions -> FIREBASE_PLIST_BASE64 -> Update, paste the base64 string, and save again."
            exit 1
          fi
          echo "::notice::Decoding FIREBASE_PLIST_BASE64 -> $PLIST"
          mkdir -p "$(dirname "$PLIST")"
          # macOS BSD base64 reads both stdin AND --input files as (null)
          # when the bytes come from a secret env var. Use Python — it
          # handles arbitrary bytes from any source — and write to the
          # expected plist path.
          python3 - <<'PYEOF' "$PLIST"
          import base64
          import os
          import string
          import sys
          plist_path = sys.argv[1]
          secret = os.environ.get("FIREBASE_PLIST_BASE64", "")
          if not secret:
              sys.stderr.write("FIREBASE_PLIST_BASE64 env var is empty\n")
              sys.exit(1)
          # Filter to base64-safe ASCII characters only. Plain
          # whitespace stripping leaves invisible Unicode alone
          # (BOM U+FEFF, NBSP U+00A0, zero-width space U+200B, ...)
          # which `base64.b64decode` rejects with "string argument
          # should contain only ASCII characters". Keeping only the
          # base64 alphabet handles all of those in one pass.
          B64_CHARS = frozenset(string.ascii_letters + string.digits + "+/=")
          clean = "".join(c for c in secret if c in B64_CHARS)
          if not clean:
              sys.stderr.write("FIREBASE_PLIST_BASE64 contained no base64 characters\n")
              sys.exit(1)
          stripped = len(secret) - len(clean)
          if stripped:
              print(f"::warning::Stripped {stripped} non-base64 characters from FIREBASE_PLIST_BASE64 (likely invisible Unicode from paste)")
          try:
              decoded = base64.b64decode(clean, validate=True)
          except Exception as e:
              sys.stderr.write(f"base64.b64decode failed: {e}\n")
              sys.stderr.write(f"Cleaned secret length: {len(clean)} chars\n")
              sys.stderr.write(f"First 80 chars of cleaned secret: {clean[:80]!r}\n")
              sys.exit(1)
          with open(plist_path, "wb") as f:
              f.write(decoded)
          print(f"Wrote {len(decoded)} bytes to {plist_path}")
          PYEOF
          /usr/bin/plutil -lint "$PLIST"
          echo "Decoded $(wc -c < "$PLIST") bytes of plist content."

      - name: Build device app without signing
        run: |
          set -uo pipefail
          # Crashlytics is still linked into the binary (Firebase init at
          # runtime) but its Run Script phase ("Upload Crashlytics Symbols")
          # is gated on CODE_SIGNING_ALLOWED — when we pass =NO here, the
          # project script short-circuits and never invokes upload-symbols,
          # so we don't need to plumb GOOGLE_APP_ID through Xcode's sandbox
          # env (which doesn't export custom build settings to Run Scripts
          # anyway). dSYM upload is meaningless for an unsigned artifact
          # that will never be distributed, so skipping it is correct.
          LOGFILE="$RUNNER_TEMP/build_log.txt"
          xcodebuild \
            -project "$PROJECT_DIR/$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > "$LOGFILE" 2>&1
          XC_EXIT=$?
          echo "xcodebuild exited with code $XC_EXIT"
          echo "LOGFILE=$LOGFILE"
          ls -la "$LOGFILE" || echo "LOGFILE NOT FOUND"
          if [ "$XC_EXIT" -ne 0 ]; then
            # Pull just the Swift error lines into a short summary
            # and post it to the run summary (visible in the
            # Actions UI even when the annotation is truncated).
            {
              echo "## xcodebuild build failed (exit $XC_EXIT)"
              echo ""
              echo "### Swift error lines"
              echo '```'
              grep -E "error:" "$LOGFILE" | head -20 || echo "(no error: lines found)"
              echo '```'
              echo ""
              echo "### Last 40 lines of build log"
              echo '```'
              tail -n 40 "$LOGFILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Also dump to the step log so the inline view
            # has the context.
            echo ""
            echo "=== Swift error lines ==="
            grep -E "error:" "$LOGFILE" | head -20 || echo "(no error: lines)"
            echo "=== Last 40 lines of build log ==="
            tail -n 40 "$LOGFILE"
            exit 1
          fi

      - name: Upload xcodebuild build log
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-build-log-${{ github.run_number }}
          path: ${{ env.RUNNER_TEMP }}/build_log.txt
          retention-days: 7
          if-no-files-found: error

      # ------------------------------------------------------------------
      # Derive a release tag from the build number we just bumped.
      # The patch component is the monotonically increasing build
      # sequence: v0.4.105, v0.4.106, and so on.
      # ------------------------------------------------------------------
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          # BUNDLE_VERSION was set by the `Bump build number` step.
          if [ -z "${BUNDLE_VERSION:-}" ]; then
            echo "::error::BUNDLE_VERSION is not set — did Bump build number run?"
            exit 1
          fi
          TAG="v0.4.${BUNDLE_VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved tag: $TAG (CFBundleVersion=$BUNDLE_VERSION)"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos"
          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "::error::Products directory $PRODUCTS_DIR does not exist."
            echo "::group::DerivedData products tree"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -print 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -name "${PRODUCT_NAME}.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::$PRODUCT_NAME.app was not found in $PRODUCTS_DIR."
            echo "::group::Contents of $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            echo "::endgroup::"
            exit 1
          fi

          rm -rf "$IPA_DIST_DIR"
          mkdir -p "$IPA_DIST_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIST_DIR/Payload/"

          (
            cd "$IPA_DIST_DIR"
            /usr/bin/zip -qry "${PRODUCT_NAME}-unsigned-${TAG}.ipa" Payload
            shasum -a 256 "${PRODUCT_NAME}-unsigned-${TAG}.ipa" > checksums.txt
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }}-unsigned-ipa-${{ env.TAG }}
          path: |
            ${{ env.IPA_DIST_DIR }}/${{ env.PRODUCT_NAME }}-unsigned-${{ env.TAG }}.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
          retention-days: 7
          if-no-files-found: error

      - name: Create prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Paladala iOS 0.4.${{ env.BUNDLE_VERSION }}
          body: |
            Unsigned iOS IPA built from ${{ github.sha }} on ${{ github.ref_name }}.

            - Commit: `${{ github.sha }}`
            - CFBundleVersion: `${{ env.BUNDLE_VERSION }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.IPA_DIST_DIR }}/${{ env.PRODUCT_NAME }}-unsigned-${{ env.TAG }}.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
