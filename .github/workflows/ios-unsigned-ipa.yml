name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - working
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.gemini/**'

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    env:
      # Use .xcworkspace when CocoaPods is used
      PROJECT_PATH: ios/BiliPaiNative/BiliPaiNative.xcworkspace
      SCHEME: BiliPaiNative
      CONFIGURATION: Release
      DERIVED_DATA: build/ios-derived-data
      IPA_DIST_DIR: build/ios-unsigned-ipa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios/BiliPaiNative
          pod install

      - name: Verify project + scheme exist
        run: |
          set -euo pipefail
          test -d "$PROJECT_PATH" || { echo "::error::Missing $PROJECT_PATH"; exit 1; }
          xcodebuild -list -workspace "$PROJECT_PATH"
          xcodebuild -list -workspace "$PROJECT_PATH" -json \
            | python3 -c "import json,sys; schemes=json.load(sys.stdin)['workspace']['schemes']; assert '$SCHEME' in schemes, f'Scheme $SCHEME not found in {schemes}'; print('Scheme $SCHEME present')"

      - name: Build device app without signing
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos"
          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "::error::Products directory $PRODUCTS_DIR does not exist."
            echo "::group::DerivedData products tree"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -print 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -name "${SCHEME}.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::$SCHEME.app was not found in $PRODUCTS_DIR."
            echo "::group::Contents of $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            echo "::endgroup::"
            exit 1
          fi

          rm -rf "$IPA_DIST_DIR"
          mkdir -p "$IPA_DIST_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIST_DIR/Payload/"

          (
            cd "$IPA_DIST_DIR"
            /usr/bin/zip -qry "${SCHEME}-unsigned.ipa" Payload
            shasum -a 256 "${SCHEME}-unsigned.ipa" > checksums.txt
          )

      - name: Verify AliPlayerSDK is embedded in the IPA
        run: |
          set -euo pipefail
          IPA_PATH="$IPA_DIST_DIR/${SCHEME}-unsigned.ipa"
          if ! /usr/bin/unzip -l "$IPA_PATH" | /usr/bin/grep -q 'Payload/.*\.app/Frameworks/AliyunPlayer.framework/AliyunPlayer'; then
            echo "::error::AliyunPlayer.framework was not embedded in the IPA."
            echo "::group::IPA contents"
            /usr/bin/unzip -l "$IPA_PATH" | head -50
            echo "::endgroup::"
            exit 1
          fi
          echo "AliyunPlayer.framework is embedded."

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}-unsigned-ipa
          path: |
            ${{ env.IPA_DIST_DIR }}/${{ env.SCHEME }}-unsigned.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
          retention-days: 7
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
