name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - working
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.gemini/**'

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    env:
      PROJECT_DIR: ios/BiliPaiNative
      PROJECT_NAME: BiliPaiNative
      CONFIGURATION: Release
      DERIVED_DATA: build/ios-derived-data
      IPA_DIST_DIR: build/ios-unsigned-ipa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          sw_vers

      # ------------------------------------------------------------------
      # Auto-increment the iOS build number so the prerelease list
      # always shows the newest at the top.  We pull the highest
      # existing `v0.4-beta-ios-N` prerelease number via the GitHub
      # API and add 1, then write that back to Info.plist *in the
      # runner's working copy only* (no commit, no push, so we
      # never race with the user pushing).  The next workflow
      # run re-derives from gh, so the sequence is monotonic
      # across runs and never resets.
      #
      # If the API call fails (offline / permissions), we fall
      # back to the value currently in Info.plist + 1 so a single
      # bad run doesn't break the pipeline.
      # ------------------------------------------------------------------
      - name: Bump build number
        run: |
          set -euo pipefail
          PLIST="$PROJECT_DIR/$PROJECT_NAME/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist not found at $PLIST"
            exit 1
          fi
          CURRENT="$(/usr/bin/plutil -extract CFBundleVersion raw "$PLIST")"
          if [ -z "$CURRENT" ]; then
            echo "::error::CFBundleVersion is empty in $PLIST"
            exit 1
          fi
          BASE_INT="${CURRENT%%.*}"
          if ! [[ "$BASE_INT" =~ ^[0-9]+$ ]]; then
            echo "::error::CFBundleVersion '$CURRENT' is not numeric"
            exit 1
          fi
          # Discover the highest existing prerelease N via
          # the GitHub Releases API.  We hit the API with
          # curl + the GITHUB_TOKEN because the previous
          # `gh release list` approach returned `[]` on
          # the runner even though the same call works
          # locally — `gh` in a `run:` block does not pick
          # up the job's GITHUB_TOKEN automatically, and
          # an unauthenticated call rate-limits / scopes
          # out to an empty list.  The curl path uses the
          # standard `Authorization: Bearer` header so
          # we know exactly what's happening.
          HIGHEST=0
          REPO="${{ github.repository }}"
          # Paginate up to 4 pages × 100 = 400 tags, more
          # than enough for the prerelease list size.
          TAGS_JSON=""
          for page in 1 2 3 4; do
            PAGE_JSON="$(curl -fsSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases?per_page=100&page=$page" \
              2>/dev/null || true)"
            if [ -z "$PAGE_JSON" ]; then break; fi
            # If the page is `[]` (no more releases) we can
            # stop early.  `jq` is installed on the macOS
            # image; if not, fall back to a length check.
            if command -v jq >/dev/null 2>&1; then
              if [ "$(echo "$PAGE_JSON" | jq 'length')" = "0" ]; then break; fi
              TAGS_JSON+="$(echo "$PAGE_JSON" | jq -r '.[].tag_name')"$'\n'
            else
              if [ "$PAGE_JSON" = "[]" ]; then break; fi
              # No jq: pull tag_name with sed (good enough).
              TAGS_JSON+="$(echo "$PAGE_JSON" \
                | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"$'\n'
            fi
          done
          # Diagnostic: dump exactly what the API returned
          # so a future failure here is easy to triage.
          echo "GitHub releases API returned:"
          printf '%s' "$TAGS_JSON" | sed '/^$/d' | sed 's/^/  /'
          TAGS="$(printf '%s' "$TAGS_JSON" | sed '/^$/d')"
          for tag in $TAGS; do
            if [[ "$tag" =~ ^v0\.3-alpha-ios-([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
              if [ "$n" -gt "$HIGHEST" ]; then HIGHEST="$n"; fi
            fi
          done
          BASE="$BASE_INT"
          if [ "$HIGHEST" -gt "$BASE" ]; then BASE="$HIGHEST"; fi
          NEW=$((BASE + 1))
          /usr/bin/plutil -replace CFBundleVersion -string "$NEW" "$PLIST"
          echo "Bumped CFBundleVersion: $CURRENT → $NEW (highest existing prerelease = $HIGHEST)"
          echo "BUNDLE_VERSION=$NEW" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # No CocoaPods step: AliyunPlayer has been replaced by AVPlayer
      # (BiliResourceLoaderDelegate.swift synthesises an HLS manifest
      # from Bilibili's DASH response and proxies fMP4 segments
      # byte-for-byte from the CDN with the right Referer).  The build
      # now consumes the bare .xcodeproj — no workspace needed.
      # ------------------------------------------------------------------

      - name: Verify scheme
        run: |
          set -euo pipefail
          PROJECT="$PROJECT_DIR/$PROJECT_NAME.xcodeproj"
          test -d "$PROJECT" || { echo "::error::Missing project: $PROJECT"; exit 1; }
          xcodebuild -list -project "$PROJECT"
          xcodebuild -list -project "$PROJECT" -json \
            | python3 -c "import json,sys; schemes=json.load(sys.stdin)['project']['schemes']; assert '$PROJECT_NAME' in schemes, f'Scheme $PROJECT_NAME not found in {schemes}'; print('Scheme $PROJECT_NAME present')"

      - name: Build device app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_DIR/$PROJECT_NAME.xcodeproj" \
            -scheme "$PROJECT_NAME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ------------------------------------------------------------------
      # Derive a release tag from the build number we just bumped
      # in `Bump build number`.  The format `v0.4-beta-ios-N` puts
      # the build number in the tag itself, so the prerelease
      # list at github.com/<repo>/releases sorts newest-first by
      # name (and the names are human-comparable: "Build 75" is
      # obviously newer than "Build 74").  The TAG env is consumed
      # by the packaging, upload-artifact, and release steps.
      # ------------------------------------------------------------------
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          # BUNDLE_VERSION was set by the `Bump build number` step.
          if [ -z "${BUNDLE_VERSION:-}" ]; then
            echo "::error::BUNDLE_VERSION is not set — did Bump build number run?"
            exit 1
          fi
          TAG="v0.4-beta-ios-${BUNDLE_VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved tag: $TAG (CFBundleVersion=$BUNDLE_VERSION)"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          PRODUCTS_DIR="$DERIVED_DATA/Build/Products/$CONFIGURATION-iphoneos"
          if [ ! -d "$PRODUCTS_DIR" ]; then
            echo "::error::Products directory $PRODUCTS_DIR does not exist."
            echo "::group::DerivedData products tree"
            find "$DERIVED_DATA/Build/Products" -maxdepth 3 -print 2>/dev/null || true
            echo "::endgroup::"
            exit 1
          fi

          APP_PATH="$(find "$PRODUCTS_DIR" -maxdepth 1 -name "${PROJECT_NAME}.app" -type d | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::$PROJECT_NAME.app was not found in $PRODUCTS_DIR."
            echo "::group::Contents of $PRODUCTS_DIR"
            ls -la "$PRODUCTS_DIR"
            echo "::endgroup::"
            exit 1
          fi

          rm -rf "$IPA_DIST_DIR"
          mkdir -p "$IPA_DIST_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIST_DIR/Payload/"

          (
            cd "$IPA_DIST_DIR"
            /usr/bin/zip -qry "${PROJECT_NAME}-unsigned-${TAG}.ipa" Payload
            shasum -a 256 "${PROJECT_NAME}-unsigned-${TAG}.ipa" > checksums.txt
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-unsigned-ipa-${{ env.TAG }}
          path: |
            ${{ env.IPA_DIST_DIR }}/${{ env.PROJECT_NAME }}-unsigned-${{ env.TAG }}.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
          retention-days: 7
          if-no-files-found: error

      - name: Create prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/working'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: iOS 0.4 BETA (Build ${{ env.BUNDLE_VERSION }})
          body: |
            Unsigned iOS IPA built from ${{ github.sha }} on ${{ github.ref_name }}.

            - Commit: `${{ github.sha }}`
            - CFBundleVersion: `${{ env.BUNDLE_VERSION }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.IPA_DIST_DIR }}/${{ env.PROJECT_NAME }}-unsigned-${{ env.TAG }}.ipa
            ${{ env.IPA_DIST_DIR }}/checksums.txt
