name: Portal Deploy

on:
  push:
    branches: [working]
    paths:
      - 'portal/**'
      - '.github/workflows/portal-deploy.yml'
  workflow_dispatch:

concurrency:
  group: portal-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install worker deps
        working-directory: portal/worker
        run: npm ci || npm install

      - name: Typecheck worker
        working-directory: portal/worker
        run: npx tsc --noEmit

      - name: Apply D1 migrations (remote)
        working-directory: portal/worker
        run: npx wrangler d1 execute paladala-portal --remote --file=./migrations/0001_init.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        working-directory: portal/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pages deps
        working-directory: portal/pages
        run: npm ci || npm install

      - name: Build pages
        working-directory: portal/pages
        run: npm run build
        env:
          PUBLIC_WORKER_URL: ${{ vars.PORTAL_WORKER_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: paladala-portal
          directory: portal/pages/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
